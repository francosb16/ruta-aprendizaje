<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Recursos complementarios | Programa del Curso</title>
	<style>
		:root { --azul:#17324d; --turquesa:#35b8b0; --amarillo:#f5c451; --coral:#e9826d; --texto:#263746; --borde:#d8e4e9; }
		* { box-sizing:border-box; }
		body { margin:0; background:#f4f7f9; color:var(--texto); font-family:Arial,Helvetica,sans-serif; line-height:1.45; }
		.contenedor { width:100%; max-width:840px; margin:0 auto; padding:8px 10px 14px; }
		.lista { display:grid; gap:8px; }
		.recurso { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:13px; padding:13px 15px; border:1px solid var(--borde); border-left:4px solid var(--turquesa); border-radius:9px; background:#fff; }
		.recurso:nth-child(2) { border-left-color:var(--amarillo); }
		.recurso:nth-child(3) { border-left-color:var(--coral); }
		.recurso:nth-child(4) { border-left-color:var(--azul); }
		.nombre { min-width:0; }
		.nombre strong { display:block; overflow-wrap:anywhere; color:var(--azul); font-size:.94rem; }
		.nombre span { display:block; margin-top:2px; color:#687681; font-size:.78rem; }
		.acciones { display:flex; align-items:center; gap:8px; }
		.acciones a, .acciones button { display:inline-flex; align-items:center; justify-content:center; min-width:104px; padding:9px 12px; border:0; border-radius:7px; color:#fff; font-family:inherit; font-size:.82rem; font-weight:700; text-decoration:none; cursor:pointer; }
		.previsualizar { background:var(--azul); }
		.descargar { background:var(--turquesa); }
		.acciones a:hover, .acciones a:focus-visible, .acciones button:hover, .acciones button:focus-visible { filter:brightness(.88); outline:3px solid rgba(53,184,176,.3); outline-offset:2px; }
		.vista-previa { width:min(900px,calc(100% - 32px)); height:min(85vh,800px); padding:0; border:0; border-radius:10px; overflow:hidden; }
		.vista-previa::backdrop { background:rgba(16,31,45,.72); }
		.vista-previa-cabecera { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; background:var(--azul); color:#fff; }
		.vista-previa-cabecera h2 { margin:0; font-size:1rem; }
		.cerrar-vista-previa { padding:5px 10px; border:1px solid rgba(255,255,255,.7); border-radius:5px; background:transparent; color:#fff; font:inherit; cursor:pointer; }
		.estado-vista-previa { margin:0; padding:12px 14px; color:#263746; background:#f4f7f9; }
		.pdf-contenedor { display:flex; align-items:flex-start; justify-content:center; width:100%; height:calc(100% - 44px); padding:12px; background:#f4f7f9; overflow:auto; }
		.pdf-canvas { display:block; max-width:100%; box-shadow:0 2px 12px rgba(23,50,77,0.15); background:#fff; }
		@media (max-width:560px) {
			.contenedor { padding:6px 8px 12px; }
			.recurso { grid-template-columns:1fr; gap:10px; padding:11px; }
			.acciones { width:100%; }
			.acciones a, .acciones button { flex:1; }
		}
	</style>
</head>
<body>
	<main class="contenedor">
		<div class="lista">
			<article class="recurso">
				<div class="nombre"><strong>PROGRAMA DEL CURSO PDS 2026</strong><span>Documento del programa del curso PDS 2026</span></div>
				<div class="acciones">
					<button class="previsualizar" type="button" data-pdf="https://raw.githubusercontent.com/francosb16/ruta-aprendizaje/main/recursos%20ruta%20de%20aprendizaje/Programa_Curso_PDSySM_2026.pdf">Previsualizar</button>
					<a class="descargar" href="https://raw.githubusercontent.com/francosb16/ruta-aprendizaje/main/recursos%20ruta%20de%20aprendizaje/Programa_Curso_PDSySM_2026.pdf" download>Descargar</a>
				</div>
			</article>
		</div>
	</main>
	<dialog class="vista-previa" aria-labelledby="titulo-vista-previa">
		<div class="vista-previa-cabecera">
			<h2 id="titulo-vista-previa">PROGRAMA DEL CURSO PDS 2026</h2>
			<button class="cerrar-vista-previa" type="button">Cerrar</button>
		</div>
		<p class="estado-vista-previa" role="status" hidden></p>
		<div class="pdf-contenedor">
			<canvas class="pdf-canvas" aria-label="Previsualización del programa del curso"></canvas>
		</div>
	</dialog>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
	<script>
		const vistaPrevia = document.querySelector(".vista-previa");
		const pdfCanvas = vistaPrevia.querySelector(".pdf-canvas");
		const estadoVistaPrevia = vistaPrevia.querySelector(".estado-vista-previa");
		const context = pdfCanvas.getContext("2d");
		const pdfjsLibInstance = window.pdfjsLib;
		let pdfDoc = null;

		pdfjsLibInstance.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

		async function renderPdf(urlPdf) {
			estadoVistaPrevia.hidden = false;
			estadoVistaPrevia.textContent = "Cargando documento...";
			pdfCanvas.style.display = "none";

			try {
				const respuesta = await fetch(urlPdf);
				if (!respuesta.ok) {
					throw new Error(`No se pudo cargar el documento (${respuesta.status}).`);
				}

				const arrayBuffer = await respuesta.arrayBuffer();
				pdfDoc = await pdfjsLibInstance.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;

				const pagina = await pdfDoc.getPage(1);
				const escala = 1.25;
				const vista = pagina.getViewport({ scale: escala });
				pdfCanvas.width = vista.width;
				pdfCanvas.height = vista.height;
				const renderContext = { canvasContext: context, viewport: vista };
				await pagina.render(renderContext).promise;

				pdfCanvas.style.display = "block";
				estadoVistaPrevia.hidden = true;
			} catch (error) {
				estadoVistaPrevia.textContent = `Error al cargar la previsualización: ${error.message}`;
				pdfCanvas.style.display = "none";
			}
		}

		document.querySelector(".previsualizar").addEventListener("click", async (evento) => {
			const urlPdf = evento.currentTarget.dataset.pdf;
			vistaPrevia.showModal();
			await renderPdf(urlPdf);
		});

		vistaPrevia.querySelector(".cerrar-vista-previa").addEventListener("click", () => {
			vistaPrevia.close();
		});

		vistaPrevia.addEventListener("close", () => {
			pdfDoc = null;
			context.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
			pdfCanvas.width = 0;
			pdfCanvas.height = 0;
			pdfCanvas.style.display = "none";
			estadoVistaPrevia.hidden = true;
			estadoVistaPrevia.textContent = "";
		});
	</script>
</body>
</html>
