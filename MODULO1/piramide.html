<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo Escuela Total Multinivel</title>

  <style>
    :root {
      --azul-oscuro: #17324d;
      --azul-medio: #35b8b0;
      --azul-claro: #7895bb;
      --texto: #263746;
      --fondo-tarjeta: #ffffff;
      --borde: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: transparent;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
      max-width: 840px;
      margin: 0 auto;
    }

    .piramide,
    .informacion {
      background: var(--fondo-tarjeta);
      border-radius: 12px;
      border: 1px solid var(--borde);
      box-shadow: 0 4px 12px rgba(23, 50, 77, 0.05);
    }

    .piramide {
      padding: 16px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .nivel {
      cursor: pointer;
      stroke: white;
      stroke-width: 2;
      transition: all 0.2s ease;
    }

    .nivel:hover,
    .nivel.activo {
      filter: brightness(1.1);
      stroke: #f5c451;
      stroke-width: 4;
    }

    .etiqueta {
      fill: white;
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
      pointer-events: none;
    }

    .informacion {
      min-height: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .informacion-content {
      flex-grow: 1;
    }

    .informacion h2 {
      margin-top: 0;
      margin-bottom: 6px;
      color: var(--azul-oscuro);
      font-size: 18px;
      font-weight: bold;
    }

    .informacion h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--azul-oscuro);
      font-size: 13px;
      font-weight: normal;
      opacity: 0.85;
    }

    .informacion p {
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
      text-align: justify;
    }

    .informacion ul {
      margin: 0 0 16px 0;
      padding-left: 18px;
    }

    .informacion li {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .aviso {
      padding: 10px 12px;
      border-left: 4px solid #f5c451;
      background: #fffdf5;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: var(--azul-oscuro);
    }

    @media (max-width: 620px) {
      main {
        grid-template-columns: 1fr;
      }

      .etiqueta {
        font-size: 13px;
      }

      .informacion {
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <main>
    <!-- PIRÁMIDE INTERACTIVA -->
    <section class="piramide">
      <svg viewBox="0 0 700 500" aria-label="Pirámide interactiva del Modelo Escuela Total Multinivel">

        <!-- NIVEL 3: ATENCIÓN ESPECIALIZADA -->
        <polygon
          id="nivel3"
          class="nivel"
          points="350,20 450,150 250,150"
          fill="#17324d"
          tabindex="0">
        </polygon>

        <!-- NIVEL 2: PREVENCIÓN FOCALIZADA -->
        <polygon
          id="nivel2"
          class="nivel"
          points="250,150 450,150 570,300 130,300"
          fill="#416b9f"
          tabindex="0">
        </polygon>

        <!-- NIVEL 1: PROMOCIÓN UNIVERSAL -->
        <polygon
          id="nivel1"
          class="nivel activo"
          points="130,300 570,300 680,470 20,470"
          fill="#7895bb"
          tabindex="0">
        </polygon>

        <!-- ETIQUETAS SOBRE LA PIRÁMIDE -->
        <text x="350" y="100" class="etiqueta">PERSONA</text>
        <text x="350" y="235" class="etiqueta">GRUPOS ESPECÍFICOS</text>
        <text x="350" y="400" class="etiqueta">TODA LA COMUNIDAD EDUCATIVA</text>
      </svg>
    </section>

    <!-- PANEL INFORMATIVO -->
    <section class="informacion" id="informacion" aria-live="polite"></section>
  </main>

  <script>
    const contenidos = {
      nivel1: {
        titulo: "Promoción universal",
        subtitulo: "Nivel 1 · Acciones de alta cobertura y baja intensidad",
        texto:
          "Son acciones dirigidas a toda la comunidad educativa. Su objetivo es fortalecer el bienestar socioemocional y los factores protectores.",
        acciones: [
          "Educación en inclusión.",
          "Cuidado mutuo y autocuidado.",
          "Aprendizaje socioemocional.",
          "Fortalecimiento del bienestar comunitario."
        ]
      },

      nivel2: {
        titulo: "Prevención focalizada",
        subtitulo: "Nivel 2 · Acciones de mediana intensidad",
        texto:
          "Son acciones dirigidas a grupos de estudiantes que presentan mayores factores de riesgo para el bienestar y la salud mental.",
        acciones: [
          "Monitoreo de estudiantes.",
          "Apoyo psicosocial.",
          "Aprendizaje socioemocional.",
          "Participación de profesionales del establecimiento o del territorio."
        ]
      },

      nivel3: {
        titulo: "Atención especializada",
        subtitulo: "Nivel 3 · Acciones de mayor intensidad",
        texto:
          "Son acciones dirigidas a estudiantes que presentan problemas de salud mental o riesgos específicos que requieren atención profesional individual.",
        acciones: [
          "Acogida y primera respuesta.",
          "Derivación acompañada a redes de apoyo.",
          "Articulación de apoyos pedagógicos.",
          "Resguardo de la trayectoria educativa."
        ]
      }
    };

    const informacion = document.getElementById("informacion");
    const niveles = document.querySelectorAll(".nivel");

    function mostrarInformacion(id) {
      const contenido = contenidos[id];

      niveles.forEach(nivel => {
        nivel.classList.toggle("activo", nivel.id === id);
      });

      informacion.innerHTML = `
        <div class="informacion-content">
          <h2>${contenido.titulo}</h2>
          <h3>${contenido.subtitulo}</h3>
          <p>${contenido.texto}</p>
          <ul>
            ${contenido.acciones.map(accion => `<li>${accion}</li>`).join("")}
          </ul>
        </div>
        <div class="aviso">
          Selecciona otro nivel de la pirámide para consultar su información.
        </div>
      `;
    }

    niveles.forEach(nivel => {
      nivel.addEventListener("click", () => {
        mostrarInformacion(nivel.id);
      });

      nivel.addEventListener("keydown", evento => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          mostrarInformacion(nivel.id);
        }
      });
    });

    mostrarInformacion("nivel1");
  </script>
</body>
</html>
