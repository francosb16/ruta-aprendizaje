<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo Escuela Total Multinivel</title>

  <style>
    :root {
      --azul-oscuro: #17477f;
      --azul-medio: #416b9f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      color: #18324d;
      background: #f4f7fb;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 780px) minmax(280px, 430px);
      gap: 35px;
      align-items: center;
      justify-content: center;
      max-width: 1330px;
      margin: 30px auto;
    }

    .piramide {
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 18px #173f6320;
    }

    .piramide {
      padding: 28px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .nivel {
      cursor: pointer;
      stroke: white;
      stroke-width: 2;
      transition: 0.2s;
    }

    .nivel:hover,
    .nivel.activo {
      filter: brightness(1.15);
      stroke: #ffd166;
      stroke-width: 4;
    }

    .etiqueta {
      fill: white;
      font-size: 18pt;
      font-weight: bold;
      text-anchor: middle;
      pointer-events: none;
    }

    .informacion {
      display: none;
      position: fixed;
      inset: 0;
      align-items: stretch;
      justify-content: flex-end;
      background: rgba(24, 50, 77, 0.55);
      z-index: 10;
    }

    .informacion.abierto {
      display: flex;
      animation: oscurecer-fondo 0.25s ease-out;
    }

    .modal-contenido {
      position: relative;
      width: min(100%, 560px);
      height: 100%;
      overflow-y: auto;
      padding: 32px;
      border: 0;
      border-left: 4px solid #d8e4f2;
      border-radius: 18px 0 0 18px;
      background: white;
      box-shadow: -12px 0 35px rgba(23, 63, 99, 0.25);
      animation: deslizar-desde-derecha 0.35s ease-out;
    }

    @keyframes oscurecer-fondo {
      from { background: rgba(24, 50, 77, 0); }
      to { background: rgba(24, 50, 77, 0.55); }
    }

    @keyframes deslizar-desde-derecha {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .modal-cerrar {
      position: absolute;
      top: 10px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      color: var(--azul-oscuro);
      background: #e8f0fa;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-contenido h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      color: var(--azul-oscuro);
    }

    .modal-contenido h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--azul-medio);
    }

    .modal-contenido p,
    .modal-contenido li {
      line-height: 1.35;
      font-size: 0.9rem;
    }

    .modal-contenido p {
      margin: 0 0 10px;
    }

    .modal-contenido ul {
      margin: 0;
      padding-left: 20px;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }

      .modal-contenido {
        width: min(100%, 460px);
        padding: 28px 20px 20px;
      }

    }
  </style>
</head>

<body>
 

  <main>
    <section class="piramide">
      <svg viewBox="0 0 700 500" aria-label="Pirámide interactiva">

        <polygon
          id="nivel3"
          class="nivel"
          points="350,20 450,150 250,150"
          fill="#17477f"
          tabindex="0">
        </polygon>

        <polygon
          id="nivel2"
          class="nivel"
          points="250,150 450,150 570,300 130,300"
          fill="#416b9f"
          tabindex="0">
        </polygon>

        <polygon
          id="nivel1"
          class="nivel activo"
          points="130,300 570,300 680,470 20,470"
          fill="#7895bb"
          tabindex="0">
        </polygon>

        <text x="350" y="105" class="etiqueta">PERSONA</text>
        <text x="350" y="235" class="etiqueta">GRUPOS ESPECÍFICOS</text>
        <text x="350" y="405" class="etiqueta">
          TODA LA COMUNIDAD EDUCATIVA
        </text>
      </svg>

    </section>
  </main>

  <section class="informacion" id="informacion" aria-live="polite" role="dialog" aria-modal="true" aria-labelledby="titulo-informacion">
    <div class="modal-contenido">
      <button class="modal-cerrar" id="cerrar-informacion" type="button" aria-label="Cerrar información">&times;</button>
      <div id="detalle-informacion"></div>
    </div>
  </section>

  
  <script>
    const contenidos = {
      nivel1: {
        titulo: "Promoción universal",
        subtitulo: "Nivel 1 · Acciones de alta cobertura y baja intensidad",
        texto:
          "Son acciones dirigidas a toda la comunidad educativa. Su objetivo es fortalecer el bienestar socioemocional y los factores protectores.",
        acciones: [
          "Educación en inclusión.",
          "Cuidado mutuo y autocuidado.",
          "Aprendizaje socioemocional.",
          "Fortalecimiento del bienestar comunitario."
        ]
      },

      nivel2: {
        titulo: "Prevención focalizada",
        subtitulo: "Nivel 2 · Acciones de mediana intensidad",
        texto:
          "Son acciones dirigidas a grupos de estudiantes que presentan mayores factores de riesgo para el bienestar y la salud mental.",
        acciones: [
          "Monitoreo de estudiantes.",
          "Apoyo psicosocial.",
          "Aprendizaje socioemocional.",
          "Participación de profesionales del establecimiento o del territorio."
        ]
      },

      nivel3: {
        titulo: "Atención especializada",
        subtitulo: "Nivel 3 · Acciones de mayor intensidad",
        texto:
          "Son acciones dirigidas a estudiantes que presentan problemas de salud mental o riesgos específicos que requieren atención profesional individual.",
        acciones: [
          "Acogida y primera respuesta.",
          "Derivación acompañada a redes de apoyo.",
          "Articulación de apoyos pedagógicos.",
          "Resguardo de la trayectoria educativa."
        ]
      }
    };

    const informacion = document.getElementById("informacion");
    const detalleInformacion = document.getElementById("detalle-informacion");
    const cerrarInformacion = document.getElementById("cerrar-informacion");
    const niveles = document.querySelectorAll(".nivel");

    function mostrarInformacion(id) {
      const contenido = contenidos[id];

      niveles.forEach(nivel => {
        nivel.classList.toggle("activo", nivel.id === id);
      });

      detalleInformacion.innerHTML = `
        <h2 id="titulo-informacion">${contenido.titulo}</h2>
        <h3>${contenido.subtitulo}</h3>
        <p>${contenido.texto}</p>
        <ul>
          ${contenido.acciones.map(accion => `<li>${accion}</li>`).join("")}
        </ul>
      `;

      informacion.classList.add("abierto");
    }

    function cerrarModal() {
      informacion.classList.remove("abierto");
    }

    niveles.forEach(nivel => {
      nivel.addEventListener("click", () => {
        mostrarInformacion(nivel.id);
      });

      nivel.addEventListener("keydown", evento => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          mostrarInformacion(nivel.id);
        }
      });
    });

    cerrarInformacion.addEventListener("click", cerrarModal);

    informacion.addEventListener("click", evento => {
      if (evento.target === informacion) {
        cerrarModal();
      }
    });

    document.addEventListener("keydown", evento => {
      if (evento.key === "Escape") {
        cerrarModal();
      }
    });
  </script>
</body>
</html>
