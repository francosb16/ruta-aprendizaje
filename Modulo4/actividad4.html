<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2477b7">
    <title>Actividad 3 | Mi mapa de redes de apoyo</title>
    <style>
        :root {
            --azul: #2477b7;
            --azul-oscuro: #155b91;
            --rojo: #ef4654;
            --texto: #263746;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 0 0 24px;
            background: var(--azul);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        main {
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .poster {
            position: relative;
            width: min(100vw, 77.426svh, 734px);
            aspect-ratio: 734 / 948;
            flex: 0 0 auto;
            overflow: hidden;
            background: var(--azul);
        }

        .poster-grafico {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .cuadrante {
            position: absolute;
            z-index: 1;
            display: flex;
            width: 18%;
            height: 8%;
            padding: 0.45%;
            transform: translate(-50%, -50%);
        }

        .cuadrante textarea {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            padding: 4px 6px;
            border: 1px solid rgba(255, 255, 255, 0.68);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.66);
            color: #17324d;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(8px, 1.65vw, 12px);
            line-height: 1.25;
            resize: none;
        }

        .cuadrante textarea::placeholder {
            color: #526577;
            opacity: 1;
        }

        .cuadrante textarea:focus {
            position: relative;
            z-index: 2;
            width: 190%;
            height: 180%;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.24);
            font-size: max(16px, 1.65vw);
            outline: 3px solid rgba(21, 91, 145, 0.45);
        }

        .familia {
            top: 46.5%;
            left: 33%;
        }

        .amistades {
            top: 46.5%;
            left: 67%;
        }

        .trabajo {
            top: 71.5%;
            left: 33%;
        }

        .comunidad {
            top: 71.5%;
            left: 67%;
        }

        .instrucciones {
            width: min(calc(100% - 32px), 734px);
            margin-top: 16px;
            padding: clamp(18px, 4vw, 30px);
            border-radius: 16px;
            background: #fff;
        }

        .reflexion {
            padding: 16px;
            border-left: 5px solid var(--rojo);
            border-radius: 9px;
            background: #eaf3fb;
        }

        .reflexion label {
            display: block;
            margin-bottom: 8px;
            color: var(--azul-oscuro);
            font-weight: 700;
        }

        .reflexion textarea {
            display: block;
            width: 100%;
            min-height: 90px;
            padding: 10px;
            border: 1px solid #c7d6e2;
            border-radius: 7px;
            color: var(--texto);
            font: inherit;
            resize: vertical;
        }

        textarea:focus-visible {
            outline: 3px solid rgba(36, 119, 183, 0.25);
            outline-offset: 1px;
        }

        .acciones {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .boton-pdf {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 11px 20px;
            border: 0;
            border-radius: 8px;
            background: var(--azul);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .boton-pdf:hover {
            background: var(--azul-oscuro);
        }

        .boton-pdf:focus-visible {
            outline: 3px solid rgba(36, 119, 183, 0.35);
            outline-offset: 3px;
        }

        footer {
            width: min(calc(100% - 32px), 734px);
            padding: 16px;
            color: #fff;
            font-size: 0.86rem;
            text-align: center;
        }

        @media (max-width: 520px) {
            .cuadrante {
                width: 19%;
                height: 9%;
                padding: 0.6%;
            }

            .cuadrante textarea {
                padding: 3px;
                font-size: 8px;
            }

            .cuadrante textarea:focus {
                width: 210%;
                height: 190%;
                font-size: 16px;
            }

            .familia,
            .trabajo {
                left: 33%;
            }

            .amistades,
            .comunidad {
                left: 67%;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm;
            }

            body {
                min-width: 0;
                min-height: 0;
                padding: 0;
                background: #fff;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            .poster {
                width: 174mm;
                max-height: 224mm;
                margin: 0 auto;
                break-inside: avoid;
            }

            .cuadrante textarea {
                border-color: #9aacc0;
                background: rgba(255, 255, 255, 0.82);
                font-size: 8pt;
            }

            .cuadrante textarea:focus {
                width: 100%;
                height: 100%;
                box-shadow: none;
                font-size: 8pt;
                outline: none;
            }

            .instrucciones {
                width: 100%;
                margin-top: 4mm;
                padding: 0;
                break-inside: avoid;
            }

            .reflexion {
                margin: 0 !important;
                padding: 3mm;
            }

            .reflexion textarea {
                min-height: 20mm;
            }

            .acciones,
            footer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="poster" aria-label="Mi mapa de redes de apoyo interactivo">
            <svg class="poster-grafico" viewBox="0 0 734 948" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <path id="arco-familia" d="M128 447 Q153 394 216 351" />
                    <path id="arco-amigos" d="M498 333 Q566 378 608 451" />
                    <path id="arco-lugar" d="M111 610 Q139 775 327 821" />
                    <path id="arco-comunidad" d="M500 788 Q570 743 609 665" />
                </defs>

                <rect width="734" height="948" fill="#2477b7" />
                <text x="367" y="136" fill="#fff" font-size="48" font-weight="300" text-anchor="middle" letter-spacing="-1.3">RECONOZCO MIS</text>
                <text x="367" y="187" fill="#fff" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="-1.1">REDES DE</text>
                <text x="367" y="236" fill="#fff" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="-1.1">APOYO</text>

                <circle cx="370" cy="561" r="299" fill="#7596c9" />
                <circle cx="370" cy="561" r="209" fill="#a9b9da" />
                <circle cx="370" cy="561" r="122" fill="#dfe5f1" />

                <g fill="none" stroke="#277bbb" stroke-width="1.4" stroke-dasharray="8 7">
                    <path d="M70 561H670" />
                    <path d="M370 262V860" />
                </g>

                <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="1.1">
                    <text><textPath href="#arco-familia">Mi familia</textPath></text>
                    <text><textPath href="#arco-amigos">Mis amigos/as</textPath></text>
                    <text><textPath href="#arco-lugar">Mi lugar de estudios/trabajo</textPath></text>
                    <text><textPath href="#arco-comunidad">Mi comunidad</textPath></text>
                </g>

                <g aria-label="Yo, en el centro de las redes de apoyo">
                    <circle cx="370" cy="561" r="41" fill="#fff" stroke="#ef4654" stroke-width="5" />
                    <circle cx="370" cy="561" r="30" fill="#2477b7" />
                    <text x="370" y="553" fill="#fff" font-size="17" text-anchor="middle">YO</text>
                    <path d="M350 562h40a20 20 0 0 1-40 0Z" fill="#fff" />
                </g>

                <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="300">
                    <text x="33" y="892"><tspan font-weight="700">#</tspan>MEJOREMOS</text>
                    <text x="47" y="915">LA<tspan font-weight="700"> SALUD</tspan> MENTAL</text>
                </g>
            </svg>

            <div class="cuadrante familia">
                <textarea name="familia" aria-label="Mi familia: personas, equipos o instituciones de apoyo" placeholder="Escribe aquí" spellcheck="true"></textarea>
            </div>
            <div class="cuadrante amistades">
                <textarea name="amistades" aria-label="Mis amistades: personas, equipos o instituciones de apoyo" placeholder="Escribe aquí" spellcheck="true"></textarea>
            </div>
            <div class="cuadrante trabajo">
                <textarea name="trabajo-estudios" aria-label="Mi lugar de trabajo o estudios: personas, equipos o instituciones de apoyo" placeholder="Escribe aquí" spellcheck="true"></textarea>
            </div>
            <div class="cuadrante comunidad">
                <textarea name="comunidad" aria-label="Mi comunidad: personas, equipos o instituciones de apoyo" placeholder="Escribe aquí" spellcheck="true"></textarea>
            </div>
        </section>

        <section class="instrucciones" aria-label="Reflexión y descarga de la actividad">
            <div class="reflexion">
                <label for="reflexion">Reflexiona: ¿A quién puedo acudir en momentos de alta exigencia?</label>
                <textarea id="reflexion" name="reflexion" placeholder="Escribe tu reflexión aquí." spellcheck="true"></textarea>
            </div>
            <div class="acciones">
                <button class="boton-pdf" type="button" onclick="window.print()">
                    <span aria-hidden="true">↓</span>
                    Descargar actividad en PDF
                </button>
            </div>
        </section>

        <footer>#MEJOREMOS LA SALUD MENTAL</footer>
    </main>
</body>
</html>
